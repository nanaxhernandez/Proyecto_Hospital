<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head">
    <meta charset="UTF-8">
    <title>Sistema Hospitalario</title>
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <!-- Header -->
    <header th:fragment="header">
        <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">Hospital</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" th:href="@{/usuario/listado}">Usuarios</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/paciente/listado}">Pacientes</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/doctor/listado}">Doctores</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/cita/listado}">Citas</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/reporte/listado}">Reportes</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/historialmedico/listado}">HistorialMédico</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/facturacion/listado}">Facturación</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/inventario/listado}">Inventario</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item" sec:authorize="!isAuthenticated()">
                            <a class="nav-link" th:href="@{/login}">Iniciar Sesión</a>
                        </li>
                        <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                👤 <span sec:authentication="name">Usuario</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><span class="dropdown-item-text">Rol: <span sec:authentication="principal.authorities[0]">ROLE_USER</span></span></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="d-inline">
                                        <button type="submit" class="dropdown-item">Cerrar Sesión</button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Footer -->
    <footer th:fragment="footer" class="bg-light text-center py-3 mt-4">
        <p>&copy; 2026 Sistema Hospitalario - Proyecto académico</p>
    </footer>
</body>
</html>
