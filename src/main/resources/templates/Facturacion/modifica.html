<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="general/fragmentos :: head"></head>
<body>
    <header th:replace="general/fragmentos :: header"></header>

    <div class="container mt-4">
        <h2 th:text="${facturacion.idFactura == null} ? 'Nueva Factura' : 'Modificar Factura'"></h2>

        <form th:action="@{/facturacion/guardar}" th:object="${facturacion}" method="post">
            <input type="hidden" th:field="*{idFactura}" />

            <div class="mb-3">
                <label>Número de Factura</label>
                <input type="text" th:field="*{numeroFactura}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Cliente</label>
                <input type="text" th:field="*{cliente}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Monto</label>
                <input type="number" step="0.01" th:field="*{monto}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Fecha de Factura</label>
                <input type="date" th:field="*{fechaFactura}" class="form-control" required>
            </div>

            <div class="mb-3">
                <label>Estado</label>
                <input type="text" th:field="*{estado}" class="form-control">
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a th:href="@{/facturacion/listado}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>

    <footer th:replace="general/fragmentos :: footer"></footer>
</body>
</html>
