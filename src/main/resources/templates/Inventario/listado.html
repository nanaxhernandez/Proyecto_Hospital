<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="general/fragmentos :: head">
    <title>Inventario</title>
</head>
<body>
    <header th:replace="general/fragmentos :: header"></header>

    <div class="container mt-4">
        <h2>Listado de Inventario</h2>
        <a th:href="@{/inventario/nuevo}" class="btn btn-primary mb-3">Nuevo Producto</a>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Producto</th>
                    <th>Descripción</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inventario : ${inventarios}">
                    <td th:text="${inventario.idInventario}"></td>
                    <td th:text="${inventario.nombreProducto}"></td>
                    <td th:text="${inventario.descripcion}"></td>
                    <td th:text="${inventario.cantidad}"></td>
                    <td th:text="${inventario.precio}"></td>
                    <td>
                        <a th:href="@{/inventario/modificar/{id}(id=${inventario.idInventario})}" class="btn btn-warning">Modificar</a>
                        <a th:href="@{/inventario/eliminar/{id}(id=${inventario.idInventario})}" class="btn btn-danger">Eliminar</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <footer th:replace="general/fragmentos :: footer"></footer>
</body>
</html>
