<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="general/fragmentos :: head"></head>
    <body>
        <header th:replace="general/fragmentos :: header"></header>

        <div class="container mt-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-6">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="mb-0" th:text="${usuario.idUsuario == null} ? '➕ Nuevo Usuario' : '✏️ Modificar Usuario'"></h4>
                        </div>
                        <div class="card-body">
                            <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post">
                                <input type="hidden" th:field="*{idUsuario}"/>
                                
                                <div class="mb-3">
                                    <label class="form-label">Nombre</label>
                                    <input type="text" th:field="*{nombre}" class="form-control" placeholder="Nombre completo" required/>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">Correo</label>
                                    <input type="email" th:field="*{correo}" class="form-control" placeholder="correo@ejemplo.com" required/>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">Cédula</label>
                                    <input type="text" th:field="*{cedula}" class="form-control" placeholder="Número de cédula" required/>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label">Contraseña</label>
                                    <input type="password" name="password" class="form-control" placeholder="Dejar en blanco para mantener la actual"/>
                                    <div class="form-text" th:if="${usuario.idUsuario != null}">Solo complete si desea cambiar la contraseña</div>
                                
                                <div class="mb-3">
                                    <label class="form-label">Rol</label>
                                    <select th:field="*{rol}" class="form-select" required>
                                        <option value="USER">Usuario</option>
                                        <option value="ADMIN">Administrador</option>
                                        <option value="DOCTOR">Doctor</option>
                                        <option value="ENFERMERO">Enfermero</option>
                                    </select>
                                </div>
                                
                                <div class="mb-3 form-check">
                                    <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activoCheck"/>
                                    <label class="form-check-label" for="activoCheck">Activo</label>
                                </div>
                                
                                <div class="d-grid gap-2 d-md-flex">
                                    <button type="submit" class="btn btn-success">💾 Guardar</button>
                                    <a th:href="@{/usuario/listado}" class="btn btn-secondary">↩️ Cancelar</a>
                                </div>
                            </form>
                        </div>
                </div>
        </div>

        <footer th:replace="general/fragmentos :: footer"></footer>
    </body>
</html>
