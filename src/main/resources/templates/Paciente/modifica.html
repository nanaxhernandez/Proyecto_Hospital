<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="general/fragmentos :: head"></head>
<body>
    <header th:replace="general/fragmentos :: header"></header>

    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h4 class="mb-0" th:text="${paciente.idPaciente == null} ? '➕ Nuevo Paciente' : '✏️ Modificar Paciente'"></h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/paciente/guardar}" th:object="${paciente}" method="post">
                            <input type="hidden" th:field="*{idPaciente}" />
                            
                            <div class="mb-3">
                                <label class="form-label">Nombre</label>
                                <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ingrese el nombre" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Apellido</label>
                                <input type="text" th:field="*{apellido}" class="form-control" placeholder="Ingrese el apellido" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Fecha de Nacimiento</label>
                                <input type="date" th:field="*{fechaNacimiento}" class="form-control">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Dirección</label>
                                <input type="text" th:field="*{direccion}" class="form-control" placeholder="Ingrese la dirección">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Teléfono</label>
                                <input type="text" th:field="*{telefono}" class="form-control" placeholder="Ingrese el teléfono">
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Correo</label>
                                <input type="email" th:field="*{correo}" class="form-control" placeholder="correo@ejemplo.com">
                            </div>
                            
                            <div class="mb-3 form-check">
                                <input type="checkbox" th:field="*{activo}" class="form-check-input" id="activoCheck">
                                <label class="form-check-label" for="activoCheck">Activo</label>
                            </div>
                            
                            <div class="d-grid gap-2 d-md-flex">
                                <button type="submit" class="btn btn-success">💾 Guardar</button>
                                <a th:href="@{/paciente/listado}" class="btn btn-secondary">↩️ Cancelar</a>
                            </div>
                        </form>
                    </div>
            </div>
    </div>

    <footer th:replace="general/fragmentos :: footer"></footer>
</body>
</html>
